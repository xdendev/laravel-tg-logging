name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '10'
            framework: '^10.48'
            testbench: '^8.22'
          - laravel: '11'
            framework: '^11.0'
            testbench: '^9.0'
          - laravel: '12'
            framework: '^12.0'
            testbench: '^10.0'
          - laravel: '13'
            framework: '^13.0'
            testbench: '^11.0'
        exclude:
          - laravel: '10'
            php: '8.4'
          - laravel: '10'
            php: '8.5'
          - laravel: '11'
            php: '8.5'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      # every Laravel 10/11 release has unpatched advisories (EOL), Composer refuses to install them by default
      - name: Allow end-of-life Laravel versions
        if: matrix.laravel == '10' || matrix.laravel == '11'
        run: composer config policy.advisories.block false || composer config audit.block-insecure false

      - name: Install dependencies
        run: |
          composer require --dev --no-update "laravel/framework:${{ matrix.framework }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress -W

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    name: PHPStan & Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pint
        run: vendor/bin/pint --test
